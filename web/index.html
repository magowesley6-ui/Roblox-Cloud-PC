<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Cloud PC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #101114;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: #1b1d23;
    padding: 25px;
    border-radius: 16px;
    border: 1px solid #333640;
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #aaa;
}

.status {
    background: #292c34;
    padding: 15px;
    border-radius: 10px;
    margin: 25px 0;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #101114;
    color: white;
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 8px;
    background: #2775ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:active {
    background: #1555c9;
}

#message {
    color: #ffcc66;
    text-align: center;
    margin-top: 18px;
}
</style>
</head>

<body>
<div class="container">

    <h1>Roblox Cloud PC</h1>
    <p class="subtitle">Seu computador remoto</p>

    <div class="status">
        <strong>Status:</strong>
        <span style="color:#ff6464">● Desconectado</span>
    </div>

    <h3>Conectar ao computador</h3>

    <input
        type="text"
        id="address"
        placeholder="Endereço do computador"
    >

    <button onclick="connect()">
        Conectar
    </button>

    <p id="message">
        O serviço de PC remoto ainda não foi configurado.
    </p>

</div>

<script>
function connect() {
    const address = document.getElementById("address").value;
    const message = document.getElementById("message");

    if (!address.trim()) {
        message.textContent = "Digite o endereço do computador.";
        return;
    }

    message.textContent =
        "Painel criado! A conexão remota ainda precisa ser implementada.";
}
</script>

</body>
</html>
