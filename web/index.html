<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Cloud PC</title>
<style>
body {
    background: #101114;
    color: white;
    font-family: Arial;
    padding: 20px;
}
.container {
    max-width: 550px;
    margin: 40px auto;
    background: #1b1d23;
    padding: 25px;
    border-radius: 15px;
}
.status {
    background: #292c34;
    padding: 15px;
    border-radius: 10px;
}
button {
    width: 100%;
    padding: 14px;
    background: #2775ff;
    color: white;
    border: 0;
    border-radius: 8px;
    margin-top: 15px;
}
</style>
</head>
<body>
<div class="container">
    <h1>Roblox Cloud PC</h1>
    <p>Seu computador remoto</p>

    <div class="status">
        Servidor: <strong id="status">Verificando...</strong>
    </div>

    <button onclick="checkServer()">Verificar novamente</button>

    <p id="message"></p>
</div>

<script>
async function checkServer() {
    const status = document.getElementById("status");
    const message = document.getElementById("message");

    status.textContent = "Verificando...";

    try {
        const response = await fetch("/health");
        if (!response.ok) throw new Error();

        const data = await response.json();
        status.textContent = "ONLINE";
        status.style.color = "#55dd88";
        message.textContent = data.app + " está funcionando.";
    } catch {
        status.textContent = "OFFLINE";
        status.style.color = "#ff6464";
        message.textContent = "Não foi possível acessar o servidor.";
    }
}

checkServer();
</script>
</body>
</html>
